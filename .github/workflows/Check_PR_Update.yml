name: Test deployment

on:
  pull_request:
    paths-ignore:
      - "ISSUE_TEMPLATE/**"
      - ".github/**.md"
      - ".gitignore"
      - "demo/**"
      - "docker/**"
      - "HOW_TO.md"
      - "TASK.md"
      - "SECURITY.md"
      - "README.md"
      - "README_zh-CN.md"
  
  # 添加push事件，确保翻译后的提交也会触发检查
  push:
    # 只在PR分支上触发，避免在主分支上重复运行
    branches-ignore:
      - main
      - master
      - docusaurus-version
    paths-ignore:
      - "ISSUE_TEMPLATE/**"
      - ".github/**.md"
      - ".gitignore"
      - "demo/**"
      - "docker/**"
      - "HOW_TO.md"
      - "TASK.md"
      - "SECURITY.md"
      - "README.md"
      - "README_zh-CN.md"

env:
  NODE_OPTIONS: --max_old_space_size=20480
  
jobs:
  test-deploy:
    name: Test deployment
    # 避免重复运行：如果是push事件且commit message包含特定标记，可以跳过
    if: |
      github.event_name == 'pull_request' || 
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip deploy]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        
      - name: Test build website
        run: yarn docusaurus build
        
      - name: Report build status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            // 只在push事件且是翻译或撤回操作时报告状态
            if (context.eventName === 'push') {
              const commitMessage = context.payload.head_commit.message;
              if (commitMessage.includes('🌍 自动翻译文档') || commitMessage.includes('撤回翻译')) {
                const { owner, repo } = context.repo;
                const sha = context.sha;
                const success = '${{ job.status }}' === 'success';
                
                // 创建commit status
                await github.rest.repos.createCommitStatus({
                  owner,
                  repo,
                  sha,
                  state: success ? 'success' : 'failure',
                  target_url: `https://github.com/${owner}/${repo}/actions/runs/${{ github.run_id }}`,
                  description: success ? 'Build succeeded' : 'Build failed',
                  context: 'continuous-integration/docusaurus'
                });
                
                console.log(`Build status reported: ${success ? 'success' : 'failure'}`);
              }
            }